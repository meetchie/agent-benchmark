categories:
  - id: market_aggregator
    label: "Market Aggregator"
    tasks:
      - id: add_bananas
        label: "Add Organic Bananas to cart"
        goal: |
          Set delivery address to 1 Main St, Springfield, IL 62701. Select the first autocomplete result.
          Search for "Organic Bananas" and add the first result to cart.
          Verify success by checking that the cart icon shows a count or an "In cart" indicator appears.
      - id: add_milk
        label: "Add whole milk (non-organic) to cart"
        goal: |
          Set delivery address to 1 Main St, Springfield, IL 62701. Select the first autocomplete result.
          Find a gallon of whole milk that is NOT organic and add it to cart.
          Verify success by checking that the cart icon shows a count or an "In cart" indicator appears.
      - id: add_three_produce
        label: "Add 3 distinct produce items to cart"
        goal: |
          Set delivery address to 1 Main St, Springfield, IL 62701. Select the first autocomplete result.
          Browse the produce section and add 3 distinct items to cart.
          Verify success by checking that the cart shows 3 items.

  - id: food_delivery
    label: "Food Delivery"
    tasks:
      - id: pizza_order
        label: "Order half-and-half pizza with sides"
        goal: |
          Order a large pizza that is half cheese, half pepperoni.
          Also add a large Diet Coke and garlic bread twists (or closest available side).
          Verify success by checking that all items appear in the cart or order summary.
      - id: popular_item
        label: "Order most popular item from first restaurant"
        goal: |
          Set delivery address to 1 Main St, Springfield, IL 62701.
          Select the first available restaurant and order their most popular or featured item.
          Verify success by checking the cart or order summary shows the item.
      - id: rated_restaurant
        label: "Order featured item from a 4+ star restaurant"
        goal: |
          Set delivery address to 1 Main St, Springfield, IL 62701.
          Find a restaurant with a 4+ star rating, pick a featured or popular item, and add it to cart.
          Verify success by checking the cart shows the item.

  - id: ecommerce
    label: "E-commerce"
    tasks:
      - id: shoes_size_10
        label: "Find running shoes in size 10 and add to cart"
        goal: |
          Search for men's running shoes.
          Filter or sort results to find options available in US size 10.
          Add the cheapest available size-10 option to cart.
          Verify success by checking the cart shows the shoes.
      - id: hoodie_under_100
        label: "Find a hoodie under $100 and add to cart"
        goal: |
          Find a hoodie priced under $100.
          Select a color and size (any available), then add to cart.
          Verify success by checking the cart shows the hoodie.
      - id: jacket_filtered
        label: "Search for a jacket, apply a filter, add to cart"
        goal: |
          Search for a jacket using the site's search feature.
          Apply at least one filter (e.g., color, size, price range, or category).
          Add the first filtered result to cart.
          Verify success by checking the cart shows the jacket.

  - id: generic
    label: "Generic"
    tasks:
      - id: search_add_to_cart
        label: "Find any product and add to cart"
        goal: |
          Use the site's search bar to find any product.
          Add the first result to cart.
          Verify success by checking the cart shows the item.
      - id: find_contact
        label: "Find contact email or phone number"
        goal: |
          Navigate to the contact or support page.
          Report the contact email address or phone number found on the page.
      - id: proceed_to_checkout
        label: "Add item to cart and proceed to checkout"
        goal: |
          Find any product and add it to cart.
          Proceed to checkout (do NOT complete the purchase — stop at the checkout page).
          Verify success by confirming the checkout page is visible.
      - id: search_report_results
        label: "Search and report first 3 results"
        goal: |
          Use the site's search feature to search for any product.
          Report the name, price, and availability of the first 3 results shown.
