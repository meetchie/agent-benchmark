[project]
name = "clean-room"
version = "0.1.0"
description = "Clean-room telemetric agent testing environment for browser automation frameworks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core browser automation
    "browser-use>=0.11.2",
    "browserbase>=1.4.0",
    "playwright>=1.40.0",
    
    # Steel SDK for STEEL agent
    "steel-sdk>=0.1.0",
    
    # LLM orchestration
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    
    # HTTP clients (for SKYVERN agent)
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    
    # Environment and utilities
    "python-dotenv>=1.0.0",
    
    # Optional: for MCP integration
    "mcp>=1.0.0",

    # LLM providers for RINDLER agent
    "openai>=1.0.0",
    "anthropic>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
