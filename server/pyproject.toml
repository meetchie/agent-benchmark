[project]
name = "agent-benchmark"
version = "0.2.0"
description = "Live browser-agent benchmark API, head-to-head arena and comparison CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Browser agent. browser-use drives Chromium over CDP; Playwright supplies
    # the Chromium download and the API used by the local Rindler interpreter.
    "browser-use>=0.13.11,<0.14",
    "playwright>=1.55.0",

    # LLM provider (default). Capped below 2 because browser-use 0.13 requires
    # anthropic<2.
    "anthropic>=1.17.0,<2",

    # Benchmark API server
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.1",

    # Task generator: page fetch and metadata extraction
    "aiohttp>=3.14.0",
    "certifi>=2025.1.1",
    "beautifulsoup4>=4.13.0",

    # Optional Clerk auth mode (JWKS verification)
    "PyJWT[crypto]>=2.10.0",

    # Comparison CLI: task files and charts
    "pyyaml>=6.0.2",
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",

    # Only benchmark_runner's optional Browserbase provider imports it (the arena
    # runs locally). Drop it together with that provider.
    "browserbase>=1.4.0",
]

[project.optional-dependencies]
# Only needed with LLM_PROVIDER=openai. llm.py imports it lazily.
openai = ["openai>=2.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
